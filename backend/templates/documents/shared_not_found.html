<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Not Found - echodraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 100%;
        }

        .icon { 
            font-size: 4rem; 
            margin-bottom: 24px;
            opacity: 0.9;
        }

        h1 { 
            margin-bottom: 16px;
            font-size: 2rem;
            font-weight: 600;
        }

        p { 
            opacity: 0.9;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .brand {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
                margin: 10px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📄</div>
        <h1>Document Not Found</h1>
        <p>The shared document you're looking for could not be found.</p>
        <p>The link may be invalid or the document may have been removed.</p>
        <div class="brand">echodraft</div>
    </div>
</body>
</html>
